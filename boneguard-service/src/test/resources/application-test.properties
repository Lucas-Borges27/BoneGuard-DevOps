# DataSource — pool criado sem validar conexão no startup (Oracle ausente em CI)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:orcl
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.initializationFailTimeout=-1

# JPA — dialeto explícito impede Hibernate de conectar para detectar metadados
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Flyway — desativado em CI
spring.flyway.enabled=false

# RabbitMQ — dynamic=false impede criação do RabbitAdmin (que conecta ao broker no startup)
# RabbitAutoConfiguration mantida para fornecer ConnectionFactory ao RabbitMQConfig
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
spring.rabbitmq.dynamic=false

# Spring AI — chave e URL fictícias (conexão é lazy, não ocorre no startup)
spring.ai.openai.api-key=test-key-ci
spring.ai.openai.base-url=http://localhost:0

# Feign — URL fictícia (apenas proxy, sem conexão no startup)
vision.service.url=http://localhost:0
